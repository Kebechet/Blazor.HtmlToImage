name: Real browser captures

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: Release
  E2E_PROJECT: tests/Blazor.HtmlToImage.E2E/Blazor.HtmlToImage.E2E.csproj
  LIBRARY_PROJECT: src/Blazor.HtmlToImage/Blazor.HtmlToImage.csproj

jobs:
  capture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # chrome: the runner's preinstalled Chrome. webkit: Playwright's WebKit build - the engine of
        # every iOS browser and every MAUI app on iOS.
        browser: [ chrome, webkit ]
        # project: the demo and test hosts reference the library project, so every edit is tested.
        # package: they reference the packed .nupkg instead - the artifact consumers install. A
        # package that differs from its source, as 1.11.13.1 did, only fails here.
        reference: [ project, package ]

    name: capture-tests (${{ matrix.browser }}, ${{ matrix.reference }})

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore e2e suite and demo
      run: |
        dotnet restore ${{ env.E2E_PROJECT }}
        dotnet restore demo/Blazor.HtmlToImage.Demo.csproj

    - name: Pack the library into a local feed
      if: matrix.reference == 'package'
      run: |
        dotnet build ${{ env.LIBRARY_PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} -p:PackageOutputPath=${{ github.workspace }}/e2e-feed
        echo "HTMLTOIMAGE_PACKAGE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' ${{ env.LIBRARY_PROJECT }})" >> "$GITHUB_ENV"
        echo "HTMLTOIMAGE_PACKAGE_SOURCE=${{ github.workspace }}/e2e-feed" >> "$GITHUB_ENV"

    - name: Build e2e suite
      run: dotnet build ${{ env.E2E_PROJECT }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

    # Chrome needs no download: the fixture launches the runner's preinstalled one through
    # Playwright's `chrome` channel. WebKit is Playwright's own build, pinned to the package version.
    - name: Install Playwright WebKit
      if: matrix.browser == 'webkit'
      run: pwsh tests/Blazor.HtmlToImage.E2E/bin/${{ env.BUILD_CONFIGURATION }}/net10.0/playwright.ps1 install --with-deps webkit

    - name: Run real ${{ matrix.browser }} capture tests
      env:
        E2E_BROWSER: ${{ matrix.browser }}
      run: dotnet test ${{ env.E2E_PROJECT }} --no-build --configuration ${{ env.BUILD_CONFIGURATION }}
